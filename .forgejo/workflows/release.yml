name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: appliedai-macos
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      # Swift is preinstalled on the macOS runner — no toolchain setup needed
      # (unlike the Zig project, which had to install Zig).

      - name: Configure signing and notarization
        env:
          SIGNING_CERTIFICATE: ${{ secrets.CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/configure-release-signing.sh

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, and package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i '' "s/^VERSION=.*/VERSION=\"$VERSION\"/" release.sh
          chmod +x release.sh
          ./release.sh

      - name: Create Homebrew tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Package the signed, notarized, stapled .app as a tarball for Homebrew.
          # Shipped as-is to preserve the code signature + stapled ticket.
          tar -czf "release-build/keydial-kd100-${VERSION}-macos-universal.tar.gz" \
            -C release-build kd100.app

      - name: Publish Forgejo release
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION=0.0.0
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          set -- "release-build/keydial-kd100-${VERSION}-macos-universal.pkg" \
            "release-build/keydial-kd100-${VERSION}-macos-universal.tar.gz"
          shasum -a 256 "$@" > "$RUNNER_TEMP/notes.md"
          endpoint="$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases"
          forgejo_curl() {
            printf 'Authorization: token %s\n' "$FORGEJO_TOKEN" | curl -fsS -H @- "$@"
          }
          title="keydial-kd100 $GITHUB_REF_NAME"
          request=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "$title" \
            --rawfile body "$RUNNER_TEMP/notes.md" '{tag_name:$tag,name:$name,body:$body,draft:true}')
          release=$(forgejo_curl \
            -H 'Content-Type: application/json' --data-binary "$request" "$endpoint")
          release_id=$(printf '%s' "$release" | jq -er '.id')
          for asset in "$@"; do
            name=$(jq -nr --arg value "$(basename "$asset")" '$value|@uri')
            forgejo_curl -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" "$endpoint/$release_id/assets?name=$name" >/dev/null
          done
          forgejo_curl -X PATCH -H 'Content-Type: application/json' \
            --data '{"draft":false}' "$endpoint/$release_id" >/dev/null
